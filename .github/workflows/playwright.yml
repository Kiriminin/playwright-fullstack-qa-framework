name: Playwright Full-Stack Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: UI, API and DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      SPRINT: sprint5
      DISABLE_LOGGING: "true"

      UI_BASE_URL: http://127.0.0.1:4200
      API_BASE_URL: http://127.0.0.1:8091

      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: root
      DB_NAME: toolshop

    steps:
      - name: Checkout test framework
        uses: actions/checkout@v4

      - name: Checkout application under test
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: practice-software-testing

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install framework dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build and start application
        working-directory: practice-software-testing
        run: |
          docker compose -f docker-compose.yml up \
            -d \
            --build \
            --force-recreate \
            mariadb laravel-api web angular-ui

      - name: Install application dependencies
        working-directory: practice-software-testing
        run: |
          docker compose -f docker-compose.yml exec -T -u root laravel-api \
            sh -c "composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi && chown -R www-data:www-data storage bootstrap/cache && chmod -R 777 storage bootstrap/cache"

      - name: Wait for database
        working-directory: practice-software-testing
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose -f docker-compose.yml exec -T mariadb \
              mysqladmin ping -h localhost -uroot -proot --silent; then
              echo "Database is ready"
              exit 0
            fi

            echo "Waiting for database: attempt $attempt/60"
            sleep 5
          done

          docker compose -f docker-compose.yml logs --no-color mariadb
          exit 1

      - name: Run database migrations and seed
        working-directory: practice-software-testing
        shell: bash
        run: |
          for attempt in {1..20}; do
            if docker compose -f docker-compose.yml exec -T laravel-api \
              php artisan migrate:fresh --seed; then
              exit 0
            fi

            echo "Migration attempt $attempt/20 failed"
            sleep 5
          done

          docker compose -f docker-compose.yml logs --no-color laravel-api
          exit 1

      - name: Wait for UI
        working-directory: practice-software-testing
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null "$UI_BASE_URL"; then
              echo "UI is ready"
              exit 0
            fi

            echo "Waiting for UI: attempt $attempt/60"
            sleep 5
          done

          docker compose -f docker-compose.yml logs --no-color angular-ui
          exit 1

      - name: Wait for API
        working-directory: practice-software-testing
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null "$API_BASE_URL/status"; then
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API: attempt $attempt/60"
            sleep 5
          done

          docker compose -f docker-compose.yml logs --no-color web laravel-api
          exit 1

      - name: Run Playwright tests
        run: npm test

      - name: Show application logs on failure
        if: failure()
        working-directory: practice-software-testing
        run: |
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color --tail=200
          docker compose -f docker-compose.yml exec -T laravel-api \
            sh -c "tail -n 300 storage/logs/laravel.log" || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop application
        if: always()
        working-directory: practice-software-testing
        run: docker compose -f docker-compose.yml down -v --remove-orphans