name: Playwright Full-Stack Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: UI, API and DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      UI_BASE_URL: http://127.0.0.1:4200
      API_BASE_URL: http://127.0.0.1:8091
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: root
      DB_NAME: toolshop

    steps:
      - name: Checkout test framework
        uses: actions/checkout@v4

      - name: Checkout application under test
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: practice-software-testing

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start application under test
        working-directory: practice-software-testing
        run: docker compose -f docker-compose.prod.yml up --pull missing -d

      - name: Wait for database
        working-directory: practice-software-testing
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose -f docker-compose.prod.yml exec -T mariadb \
              mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi

            sleep 5
          done

          docker compose -f docker-compose.prod.yml ps
          exit 1

      - name: Run database migrations and seed
        working-directory: practice-software-testing
        shell: bash
        run: |
          for attempt in {1..20}; do
            if docker compose -f docker-compose.prod.yml exec -T laravel-api \
              php artisan migrate:fresh --seed; then
              exit 0
            fi

            sleep 5
          done

          exit 1

      - name: Wait for UI and API
        shell: bash
        run: |
          timeout 300 bash -c \
            'until curl --fail --silent http://127.0.0.1:4200 > /dev/null; do sleep 5; done'

          timeout 300 bash -c \
            'until curl --fail --silent http://127.0.0.1:8091/products > /dev/null; do sleep 5; done'

      - name: Run Playwright tests
        run: npm test

      - name: Show application logs on failure
        if: failure()
        working-directory: practice-software-testing
        run: |
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --no-color --tail=200

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop application
        if: always()
        working-directory: practice-software-testing
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans